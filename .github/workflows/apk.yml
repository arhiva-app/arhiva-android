# Pravi probnu Android Arhivu (APK). Probna učitava Arhivu sa https://arhiva-app.github.io/arhiva/,
# pa izmene u Arhivi stižu bez nove instalacije; nov APK treba samo kad se menja Android deo.
# Stalni link: releases/latest/download/Arhiva-probna.apk
name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketi
        run: npm ci
      - name: Capacitor sync
        run: npx cap sync android
      - name: Kljuc za potpis
        run: echo "${{ secrets.ARHIVA_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/probna.jks
      - name: Gradle
        env:
          ARHIVA_KEYSTORE: ${{ runner.temp }}/probna.jks
          ARHIVA_KEY_PASS: ${{ secrets.ARHIVA_KEY_PASS }}
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee ../gradle.log -ParhivaVersionCode=${{ github.run_number }} -ParhivaVersionName=0.1.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../Arhiva-probna.apk
      - name: Greska (za citanje preko API-ja)
        if: failure()
        run: |
          MSG=$( (grep -A25 'What went wrong' gradle.log || tail -40 gradle.log) | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle::${MSG}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "probna-${{ github.run_number }}" Arhiva-probna.apk \
            --title "Arhiva probna 0.1.${{ github.run_number }}" \
            --notes "Android deo $(git rev-parse --short HEAD). Arhiva se učitava sa arhiva-app.github.io/arhiva/." --latest
