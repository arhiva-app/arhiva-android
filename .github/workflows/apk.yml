# Pravi probnu Android Arhivu (APK). Probna učitava Arhivu sa https://arhiva-app.github.io/arhiva/,
# pa izmene u Arhivi stižu bez nove instalacije; nov APK treba samo kad se menja Android deo.
# Stalni link: releases/latest/download/Arhiva-probna.apk
name: APK
on:
  workflow_dispatch:
  push:
    branches: [main, radna]   # radna = samo provera (bez release-a), sama se pokrene
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Paketi
        run: npm ci
      - name: Capacitor sync
        run: npx cap sync android
      - name: Kljuc za potpis
        run: echo "${{ secrets.ARHIVA_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/probna.jks
      - name: Gradle
        env:
          ARHIVA_KEYSTORE: ${{ runner.temp }}/probna.jks
          ARHIVA_KEY_PASS: ${{ secrets.ARHIVA_KEY_PASS }}
        run: |
          set -o pipefail
          echo "START $(pwd)" > "$GITHUB_WORKSPACE/gradle.log"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain -ParhivaVersionCode=${{ github.run_number }} -ParhivaVersionName=0.1.${{ github.run_number }} 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle.log"
          cp app/build/outputs/apk/debug/app-debug.apk ../Arhiva-probna.apk
      - name: Greska u granu dnevnik (za citanje)
        if: failure()
        run: |
          mkdir -p /tmp/d; cp "$GITHUB_WORKSPACE/gradle.log" /tmp/d/gradle.log 2>/dev/null || echo "nema gradle.log" > /tmp/d/gradle.log
          ls -la "$GITHUB_WORKSPACE" >> /tmp/d/gradle.log 2>&1
          ls -la android >> /tmp/d/gradle.log 2>&1 || true
          cd /tmp/d && git init -q -b dnevnik && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "dnevnik ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dnevnik
      - name: Release
        # samo sa main (posle „Sada pošalji“); sa radne grane je ovo samo provera da se APK pravi
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "probna-${{ github.run_number }}" Arhiva-probna.apk \
            --title "Arhiva probna 0.1.${{ github.run_number }}" \
            --notes "Android deo $(git rev-parse --short HEAD). Arhiva se učitava sa arhiva-app.github.io/arhiva/." --latest
