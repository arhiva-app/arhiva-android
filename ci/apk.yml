# Pravi probnu Android Arhivu (APK) od objavljene web Arhive (arhiva-app/arhiva, grana main)
# i stavlja je na stranicu Releases. Stalni link: releases/latest/download/Arhiva-probna.apk
name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketi
        run: npm ci
      - name: Web Arhiva u www
        run: |
          git clone --depth 1 https://github.com/arhiva-app/arhiva.git web
          WEB=$(git -C web rev-parse --short HEAD)
          echo "WEB=$WEB" >> $GITHUB_ENV
          rm -rf www && mkdir www
          cp -r web/. www/ && rm -rf www/.git www/sw.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/
          cp native/arhiva-native.js www/
          python3 native/ubaci.py www/index.html
      - name: Capacitor sync
        run: npx cap sync android
      - name: Kljuc za potpis
        run: echo "${{ secrets.ARHIVA_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/probna.jks
      - name: Gradle
        env:
          ARHIVA_KEYSTORE: ${{ runner.temp }}/probna.jks
          ARHIVA_KEY_PASS: ${{ secrets.ARHIVA_KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -ParhivaVersionCode=${{ github.run_number }} -ParhivaVersionName=0.1.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../Arhiva-probna.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "probna-${{ github.run_number }}" Arhiva-probna.apk \
            --title "Arhiva probna 0.1.${{ github.run_number }}" \
            --notes "Web Arhiva: ${WEB}" --latest
